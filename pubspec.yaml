name: tastee
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── State Management ──
  flutter_bloc: ^9.1.0

  # ── Backend ──
  supabase_flutter: ^2.9.0
  google_sign_in: 7.2.0
  dio: ^5.4.3+1

  # ── Local Storage ──
  shared_preferences: ^2.3.3
  dartz: ^0.10.1
  skeletonizer: ^2.1.3
  drift: ^2.18.0
  drift_flutter: ^0.2.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/


  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400